name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  public-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check portable public source
        run: python3 tooling/check_public.py
      - name: Test public-source rules
        run: python3 -m unittest discover -s tooling -p 'test_check_public.py'

  rust:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        if: runner.os != 'macOS'
        with:
          version: 0.15.2
      - name: Install patched Zig on macOS
        if: runner.os == 'macOS'
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install zig@0.15
          echo "$(brew --prefix zig@0.15)/bin" >> "$GITHUB_PATH"
          echo "ZIG_GLOBAL_CACHE_DIR=$GITHUB_WORKSPACE/.zig-cache" >> "$GITHUB_ENV"
          echo "ZIG_LOCAL_CACHE_DIR=$GITHUB_WORKSPACE/.zig-cache" >> "$GITHUB_ENV"
          "$(brew --prefix zig@0.15)/bin/zig" version
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked -- --test-threads=1
      - name: Install and smoke-test the source checkout
        env:
          HERDUCK_CONFIG_PATH: ${{ runner.temp }}/herduck-config-smoke/config.toml
        run: |
          cargo install --path . --locked --root "$RUNNER_TEMP/herduck-install"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            codesign --force --sign - "$RUNNER_TEMP/herduck-install/bin/herduck"
          fi
          "$RUNNER_TEMP/herduck-install/bin/herduck" --version
          mkdir -p "$RUNNER_TEMP/herduck-config-smoke"
          "$RUNNER_TEMP/herduck-install/bin/herduck" --default-config > "$HERDUCK_CONFIG_PATH"
          "$RUNNER_TEMP/herduck-install/bin/herduck" config check
