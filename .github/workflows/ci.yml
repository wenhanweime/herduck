name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  public-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check portable public source
        run: python3 tooling/check_public.py
      - name: Test public-source rules
        run: python3 -m unittest discover -s tooling -p 'test_check_public.py'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test npm/test/*.test.cjs

  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            asset: herduck-macos-aarch64
          - os: macos-15-intel
            asset: herduck-macos-x86_64
          - os: ubuntu-24.04
            asset: herduck-linux-x86_64
          - os: ubuntu-24.04-arm
            asset: herduck-linux-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        if: runner.os != 'macOS'
        with:
          version: 0.15.2
      - name: Install patched Zig on macOS
        if: runner.os == 'macOS'
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install zig@0.15
          echo "$(brew --prefix zig@0.15)/bin" >> "$GITHUB_PATH"
          echo "ZIG_GLOBAL_CACHE_DIR=$GITHUB_WORKSPACE/.zig-cache" >> "$GITHUB_ENV"
          echo "ZIG_LOCAL_CACHE_DIR=$GITHUB_WORKSPACE/.zig-cache" >> "$GITHUB_ENV"
          "$(brew --prefix zig@0.15)/bin/zig" version
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked -- --test-threads=1
      - name: Install and smoke-test the source checkout
        env:
          HERDUCK_CONFIG_PATH: ${{ runner.temp }}/herduck-config-smoke/config.toml
        run: |
          cargo install --path . --locked --root "$RUNNER_TEMP/herduck-install"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            codesign --force --sign - "$RUNNER_TEMP/herduck-install/bin/herduck"
          fi
          "$RUNNER_TEMP/herduck-install/bin/herduck" --version
          mkdir -p "$RUNNER_TEMP/herduck-config-smoke"
          "$RUNNER_TEMP/herduck-install/bin/herduck" --default-config > "$HERDUCK_CONFIG_PATH"
          "$RUNNER_TEMP/herduck-install/bin/herduck" config check
      - name: Stage verified native binary
        run: |
          mkdir -p release-assets
          cp "$RUNNER_TEMP/herduck-install/bin/herduck" "release-assets/${{ matrix.asset }}"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            codesign --verify --verbose "release-assets/${{ matrix.asset }}"
          fi
          "release-assets/${{ matrix.asset }}" --version
          file "release-assets/${{ matrix.asset }}"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            readelf --version-info "release-assets/${{ matrix.asset }}" | sed -n 's/.*Name: \(GLIBC_[0-9.]*\).*/\1/p' | sort -Vu
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release-assets/${{ matrix.asset }}

  npm-package:
    needs: [public-source, rust]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          pattern: herduck-*
          merge-multiple: true
          path: release-assets
      - name: Pack launcher with exact binary hashes
        run: python3 tooling/package_release.py --assets release-assets --output release-assets
      - name: Verify archive installation and native launch offline
        run: |
          npm install --global --ignore-scripts --prefix "$RUNNER_TEMP/npm-install" ./release-assets/herduck-*.tgz
          export XDG_DATA_HOME="$RUNNER_TEMP/herduck-package-data"
          node - <<'JS'
          const fs = require('node:fs/promises');
          const path = require('node:path');
          const pkg = path.join(process.env.RUNNER_TEMP, 'npm-install/lib/node_modules/herduck');
          const { ensureBinary } = require(path.join(pkg, 'lib/install.cjs'));
          ensureBinary(require(path.join(pkg, 'manifest.json')), {
            fetchBinary: (_, destination) => fs.copyFile('release-assets/herduck-linux-x86_64', destination),
          }).catch(error => { console.error(error); process.exitCode = 1; });
          JS
          "$RUNNER_TEMP/npm-install/bin/herduck" --version
          "$RUNNER_TEMP/npm-install/bin/herduck" config check
      - uses: actions/upload-artifact@v4
        with:
          name: herduck-release
          path: release-assets/*
