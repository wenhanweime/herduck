id = "grok"
version = "2026.09.21.1"
min_engine_version = 2
updated_at = "2026-09-21T00:00:00Z"
aliases = ["grok-build"]

# Evidence: Grok Build 0.2.82 live pane reads, plus Grok 4.6 / grok-1.0.30
# `herduck agent read w3D:p1 --source detection` on 2026-09-21.
#
# Working turns render one live status line directly above the prompt box:
#   "⠧ Waiting on subagent… 2.8s   13s ⇣29.7k [stop]"
#   "⠋ Read Codex/Grok detection… 0.2s   3m10s ⇣246k [↓][stop]"
# with a braille spinner and a trailing [stop] chip. Grok 4.6 footers keep
# Ctrl+c:cancel even while idle:
#   "Shift+Tab:mode  │  Ctrl+c:cancel  │  Ctrl+b:send to bg  │  Ctrl+.:shortcuts"
# so idle must not treat Ctrl+c:cancel as "still working". Permission prompts
# and ask-user-question dialogs replace the spinner with "◆" and draw a
# "┃"-guttered option list. Idle is the shortcuts footer without a live
# [stop] chip near the prompt. Working rules stay on the bottom of the
# screen so leftover transcript lines cannot keep a pane Working forever.

[[rules]]
id = "option_dialog_blocked"
state = "blocked"
priority = 320
region = "whole_recent"
visible_blocker = true
line_regex = ['^\s*┃\s+[0-9a-z]+\s+\([●○]\)\s']

[[rules]]
id = "permission_hints_blocked"
state = "blocked"
priority = 310
region = "bottom_non_empty_lines(2)"
visible_blocker = true
contains = [":select", "ctrl+o:yolo", "ctrl+c:cancel"]

[[rules]]
id = "question_dialog_hints_blocked"
state = "blocked"
priority = 305
region = "bottom_non_empty_lines(2)"
visible_blocker = true
contains = ["tab:scrollback", "shift+x:dismiss"]

# Pre-0.2.x permission UI kept for older Grok Build releases.
[[rules]]
id = "permission_scope_selector"
state = "blocked"
priority = 300
region = "whole_recent"
visible_blocker = true
contains = ["yes, proceed", "no, reject"]
any = [
  { contains = ["use ← → to choose permission whitelist scope"] },
  { contains = ["←/→:scope"] },
]

[[rules]]
id = "spinner_status_working"
state = "working"
priority = 200
region = "bottom_non_empty_lines(10)"
visible_working = true
line_regex = ['^\s*[\x{2801}-\x{28FF}]\s.*\[stop\]\s*$']

[[rules]]
id = "esc_cancel_hints_working"
state = "working"
priority = 190
region = "bottom_non_empty_lines(2)"
visible_working = true
contains = ["esc:cancel", "ctrl+.:shortcuts"]

# Pre-0.2.x working chrome kept for older Grok Build releases.
[[rules]]
id = "waiting_tool_working"
state = "working"
priority = 120
region = "bottom_non_empty_lines(10)"
visible_working = true
any = [
  { all = [{ contains = ["ctrl+c:cancel", "ctrl+enter:interject"] }, { contains = ["waiting"] }] },
  { line_regex = ['^\s*[\x{2801}-\x{28FF}]\s+(Run|Read|Search|List)\b'] },
]

[[rules]]
id = "prompt_hints_idle"
state = "idle"
priority = 100
region = "bottom_non_empty_lines(2)"
visible_idle = true
contains = ["ctrl+.:shortcuts"]
not = [
  { contains = ["esc:cancel"] },
]
